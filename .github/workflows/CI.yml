name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.dependencies }} - ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.version == 'nightly' }}
    env:
      JULIA_NUM_PRECOMPILE_TASKS: '4'
      ODEPE_TEST_GROUP: ${{ matrix.group }}
      ODEPE_TEST_COVERAGE: ${{ matrix.group == 'all' }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1.13'
          - 'nightly'
        os:
          - ubuntu-latest
        arch:
          - x64
        group:
          - all
        dependencies:
          - registered
        include:
          - version: '1.13'
            os: ubuntu-latest
            arch: x64
            group: all
            dependencies: modern
          - version: '1.13'
            os: ubuntu-latest
            arch: x64
            group: benchmark
            dependencies: modern
          - version: '1.13'
            os: ubuntu-latest
            arch: x64
            group: examples_ci
            dependencies: registered
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - name: Test registered dependencies
        env:
          ODEPE_VALIDATION_DIR: ${{ runner.temp }}/odepe-validation
        run: julia --startup-file=no test/registered.jl "$ODEPE_TEST_GROUP" "${{ matrix.dependencies == 'modern' && 'modern' || 'default' }}"
      - name: Preserve resolved dependency versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-${{ matrix.version }}-${{ matrix.dependencies }}-${{ matrix.group }}
          path: ${{ runner.temp }}/odepe-validation
          if-no-files-found: warn
      # One job publishes coverage; the others collect it with the same settings.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.group == 'all' && matrix.version == '1.13' && matrix.dependencies == 'registered'
      - uses: codecov/codecov-action@v5
        if: matrix.group == 'all' && matrix.version == '1.13' && matrix.dependencies == 'registered'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
