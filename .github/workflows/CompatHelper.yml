name: CompatHelper
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: Pkg.add("CompatHelper")
        run: julia --startup-file=no -e 'using Pkg; Pkg.add(PackageSpec(name="CompatHelper", version="3"))'
      - name: CompatHelper.main()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional deploy key: without it, dispatch CI manually on generated
          # PR branches because GITHUB_TOKEN cannot trigger another workflow.
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --startup-file=no -e 'using CompatHelper; CompatHelper.main()'
